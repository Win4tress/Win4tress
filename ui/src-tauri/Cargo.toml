[package]
name = "win4tress-ui"
description = "win4tress desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "win4tress-ui"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Serve the built front-end from the binary instead of the Vite dev server.
# `npm run tauri build` turns this on; a plain `cargo build` gives a dev build.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
w4-ipc.workspace = true
w4-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio.workspace = true
png = "0.18.1"
base64 = "0.23.1"
tauri-plugin-notification = "2.7.0"

[dependencies.windows]
workspace = true
features = [
    "UI",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
