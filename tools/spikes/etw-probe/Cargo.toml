[package]
name = "etw-probe"
version = "0.0.0"
description = "Spike 0.1: validate per-process network byte attribution via ETW"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
ferrisetw = { version = "1.2.0", features = ["serde"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Diagnostics_Etw", "Win32_System_ProcessStatus", "Win32_UI_Shell"] }
